name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

jobs:
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run generate

      - name: Prepare SvelteKit types
        run: bun run prepare

      - name: Type check
        run: bun run check

      - name: Format check
        run: bun run format:check

      - name: Dead code check
        run: bun run knip

  boundary-check:
    name: Architecture Boundary Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run boundary checks
        run: bun run boundary-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run generate

      - name: Run unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mgetf
          POSTGRES_PASSWORD: mgetf
          POSTGRES_DB: mgetf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgetf -d mgetf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mgetf:mgetf@localhost:5432/mgetf_test
      APP_ENVIRONMENT: development
      JWT_SECRET: e2e-test-jwt-secret-at-least-32-chars-long
      SESSION_SECRET: e2e-test-session-secret-32chars!!
      STEAM_API_KEY: test-steam-api-key-not-used
      PUBLIC_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run generate

      - name: Apply migrations
        run: bun run migrate

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Run E2E tests
        run: bun run test:e2e
